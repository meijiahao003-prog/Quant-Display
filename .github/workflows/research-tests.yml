name: Research contracts and synthetic integration
on:
  pull_request:
  push:
    branches: [main, "quant-system/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[futures,dev]' xgboost lightgbm build
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - run: python -m ruff check src/futures_research src/quant_research tests/futures tests/test_factor_bridge.py tools/check_public_release.py
      - run: python tools/check_public_release.py
      - run: python -m build --wheel
      - run: quant-research demo --models xgboost,lightgbm,transformer,itransformer --output runs/ci-demo
      - run: python examples/run_sector_cta_demo.py --models xgboost,lightgbm,transformer,itransformer --output runs/ci-sector-cta
